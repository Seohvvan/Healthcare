[project]
name = "trialmatch"
version = "0.1.0"
description = "Interactive clinical trial recommendation multi-agent system (Healthcare Agentic AI Challenge 2026)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
trialmatch = "trialmatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
